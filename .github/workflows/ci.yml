name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature_args: ["", "--features unrolled"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets ${{ matrix.feature_args }} -- -D warnings

      - name: Build release
        run: cargo build --release ${{ matrix.feature_args }}

      - name: Test
        run: cargo test ${{ matrix.feature_args }}

      - name: Smoke deterministic benchmark sweep
        run: bash scripts/smoke_bench_sweep.sh
